name: Push gem

# Publishes to RubyGems.org when a matching version tag is pushed.
# Trigger: push of tag vX.Y.Z where X.Y.Z == Adressevaelger::VERSION.
# Does not auto-bump versions; bump intentionally, then tag/release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install PROJ (optional rgeo-proj4)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libproj-dev
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby
      - name: Verify tag matches gem version
        run: |
          expected="v$(ruby -r ./lib/adressevaelger/version -e 'print Adressevaelger::VERSION')"
          actual="${GITHUB_REF_NAME}"
          if [ "$actual" != "$expected" ]; then
            echo "Tag $actual does not match Adressevaelger::VERSION ($expected)"
            exit 1
          fi
      - uses: rubygems/release-gem@v1
